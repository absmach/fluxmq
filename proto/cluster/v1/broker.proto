syntax = "proto3";

package fluxmq.cluster.v1;

import "google/protobuf/timestamp.proto";

// BrokerService defines RPC methods for inter-broker communication in the cluster.
// This is an internal API not exposed to clients.
service BrokerService {
  // RoutePublish forwards a PUBLISH packet to the broker that owns the target session.
  rpc RoutePublish(PublishRequest) returns (PublishResponse);

  // RoutePublishBatch forwards multiple PUBLISH packets in one RPC.
  rpc RoutePublishBatch(PublishBatchRequest) returns (PublishBatchResponse);

  // TakeoverSession migrates a session from one broker to another.
  rpc TakeoverSession(TakeoverRequest) returns (TakeoverResponse);

  // FetchRetained fetches a retained message payload from the owning broker node.
  rpc FetchRetained(FetchRetainedRequest) returns (FetchRetainedResponse);

  // FetchWill fetches a will message payload from the owning broker node.
  rpc FetchWill(FetchWillRequest) returns (FetchWillResponse);

  // EnqueueRemote routes an enqueue operation to the remote node.
  rpc EnqueueRemote(EnqueueRemoteRequest) returns (EnqueueRemoteResponse);

  // RouteQueueMessage delivers a queue message to a consumer on a different node.
  rpc RouteQueueMessage(RouteQueueMessageRequest) returns (RouteQueueMessageResponse);

  // RouteQueueBatch delivers multiple queue messages in one RPC.
  rpc RouteQueueBatch(RouteQueueBatchRequest) returns (RouteQueueBatchResponse);

  // ForwardGroupOp forwards a consumer group mutation from a follower to the
  // Raft leader for the queue's replication group. The leader applies the
  // operation through its coordinator so it goes through Raft consensus.
  rpc ForwardGroupOp(ForwardGroupOpRequest) returns (ForwardGroupOpResponse);

  // ForwardPublishBatch forwards messages to a node for local fan-out.
  // The receiving node matches its own local subscriptions and delivers.
  // This replaces per-subscriber routing with per-node routing.
  rpc ForwardPublishBatch(ForwardPublishBatchRequest) returns (ForwardPublishBatchResponse);
}

// =============================================================================
// Publish Routing
// =============================================================================

message PublishRequest {
  reserved 2, 3, 4, 5, 6, 7;
  reserved "topic", "payload", "qos", "retain", "dup", "properties";

  // client_id routes the publish and is readable without decoding the message.
  string client_id = 1;
  // envelope is a complete binary message.Envelope. It carries the topic,
  // payload, delivery flags and every broker-owned namespace as typed values,
  // rather than a flattened string map that had to be parsed back on arrival.
  bytes envelope = 8;
}

message PublishResponse {
  bool success = 1;
  string error = 2;

  // client_not_connected signals the delivery target had no live connection,
  // as opposed to the peer failing to handle the request. A share group uses
  // it to move on to another member without holding the peer responsible.
  bool client_not_connected = 3;
}

message PublishBatchRequest {
  repeated PublishRequest messages = 1;
}

message PublishBatchError {
  uint32 index = 1;
  string client_id = 2;
  string error = 3;
}

message PublishBatchResponse {
  bool success = 1;
  string error = 2;
  uint32 delivered = 3;
  repeated PublishBatchError failures = 4;
}

// =============================================================================
// Session Takeover
// =============================================================================

message TakeoverRequest {
  string client_id = 1;
  string from_node = 2;
  string to_node = 3;
  // identity_guard must be checked by the current owner before it disconnects
  // the session or transfers any state.
  SessionIdentityGuard identity_guard = 4;
}

message SessionIdentityGuard {
  string expected_external_id = 1;
  bool require_bound = 2;
}

enum TakeoverFailureReason {
  TAKEOVER_FAILURE_REASON_UNSPECIFIED = 0;
  TAKEOVER_FAILURE_REASON_IDENTITY_MISMATCH = 1;
}

message TakeoverResponse {
  bool success = 1;
  string error = 2;
  SessionState session_state = 3;
  TakeoverFailureReason failure_reason = 4;
}

message SessionState {
  uint32 expiry_interval = 1;
  bool clean_start = 2;
  repeated InflightMessage inflight_messages = 3;
  repeated QueuedMessage queued_messages = 4;
  repeated Subscription subscriptions = 5;
  WillMessage will = 6;
  // Canonical external principal bound during MQTT authentication. A takeover
  // must not let another principal inherit this session's state.
  string external_id = 7;
}

message InflightMessage {
  reserved 2, 3, 4, 5, 9;
  reserved "topic", "payload", "qos", "retain", "properties";

  uint32 packet_id = 1;
  int64 timestamp = 6;
  // direction: 0 = outbound (server->client), 1 = inbound (client->server).
  uint32 direction = 7;
  // state: inflight delivery state (0 = publish sent, 1 = pubrec received).
  uint32 state = 8;
  // envelope is a complete binary message.Envelope, so a takeover carries the
  // queue and transfer metadata that the string map silently dropped.
  bytes envelope = 10;
}

message QueuedMessage {
  reserved 1, 2, 3, 4;
  reserved "topic", "payload", "qos", "retain";

  int64 timestamp = 5;
  // envelope is a complete binary message.Envelope. The flattened form carried
  // no properties at all, so a takeover silently emptied the offline queue's
  // user metadata.
  bytes envelope = 6;
}

message Subscription {
  string filter = 1;
  uint32 qos = 2;
}

message WillMessage {
  string topic = 1;
  bytes payload = 2;
  uint32 qos = 3;
  bool retain = 4;
  uint32 delay = 5;
  int64 disconnect_time = 6;
}

// =============================================================================
// Retained Messages
// =============================================================================

message FetchRetainedRequest {
  string topic = 1;
}

message FetchRetainedResponse {
  bool found = 1;
  RetainedMessage message = 2;
  string error = 3;
}

message RetainedMessage {
  reserved 1, 2, 3, 4, 5;
  reserved "topic", "payload", "qos", "retain", "properties";

  int64 timestamp = 6;
  // envelope is a complete binary message.Envelope.
  bytes envelope = 7;
}

// =============================================================================
// Will Messages
// =============================================================================

message FetchWillRequest {
  string client_id = 1;
}

message FetchWillResponse {
  bool found = 1;
  WillMessage message = 2;
  string error = 3;
}

// =============================================================================
// Queue Routing
// =============================================================================

message EnqueueRemoteRequest {
  reserved 2, 3;
  reserved "payload", "properties";

  // Routing controls stay typed: they say how to route the message, not what
  // the message is, and a receiver reads them without decoding the envelope.
  //
  // queue_name names the destination of a direct enqueue and is empty for a
  // forwarded publish, which routes by the envelope's topic.
  string queue_name = 1;
  bool forwarded_publish = 4;
  bool forward_to_leader = 5;
  // envelope is a complete binary message.Envelope.
  bytes envelope = 6;
  // forward_target_queues names the queues a forwarded publish must land in.
  // It used to travel as a comma-joined string inside the user property map,
  // where it was indistinguishable from a property a publisher had set.
  repeated string forward_target_queues = 7;
}

message EnqueueRemoteResponse {
  bool success = 1;
  string error = 2;
}

message RouteQueueMessageRequest {
  reserved 3, 4, 5, 7;
  reserved "message_id", "payload", "properties", "topic";

  string client_id = 1;
  string queue_name = 2;
  int64 sequence = 6;
  // envelope is a complete binary message.Envelope. message_id is gone with
  // the string map: it was a synthesized queue:offset that overwrote whatever
  // the publisher had set, and sequence already carries the offset.
  bytes envelope = 8;
}

message RouteQueueMessageResponse {
  bool success = 1;
  string error = 2;
  // client_not_connected signals the delivery target had no live connection,
  // so the sender can evict the stale consumer without parsing error text.
  bool client_not_connected = 3;
}

message RouteQueueBatchRequest {
  repeated RouteQueueMessageRequest messages = 1;
}

message RouteQueueBatchError {
  uint32 index = 1;
  string client_id = 2;
  string queue_name = 3;
  string error = 4;
  // client_not_connected signals the delivery target had no live connection,
  // so the sender can evict the stale consumer without parsing error text.
  bool client_not_connected = 5;
}

message RouteQueueBatchResponse {
  bool success = 1;
  string error = 2;
  uint32 delivered = 3;
  repeated RouteQueueBatchError failures = 4;
}

// =============================================================================
// Consumer Group Operation Forwarding
// =============================================================================

// ForwardGroupOpRequest carries a consumer group mutation from a follower to
// the Raft leader.
message ForwardGroupOpRequest {
  string queue_name = 1;

  // Field 2 held op_data, a JSON-encoded Go struct. It is retired: an opaque
  // blob inside a versioned schema is invisible to compatibility checking, and
  // renaming an unexported Go field silently changed the wire format.
  reserved 2;
  reserved "op_data";

  GroupOperation operation = 3;
}

// GroupOperation is a consumer group mutation applied through Raft consensus.
// queue_name and group_id identify the target; the oneof selects the mutation.
message GroupOperation {
  string queue_name = 1;
  string group_id = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof operation {
    CreateGroupOp create_group = 4;
    UpdateGroupOp update_group = 5;
    DeleteGroupOp delete_group = 6;
    UpdateCursorOp update_cursor = 7;
    UpdateCommittedOp update_committed = 8;
    AddPendingOp add_pending = 9;
    RemovePendingOp remove_pending = 10;
    TransferPendingOp transfer_pending = 11;
    RegisterConsumerOp register_consumer = 12;
    UnregisterConsumerOp unregister_consumer = 13;
    RequeuePendingOp requeue_pending = 14;
  }
}

message CreateGroupOp {
  ConsumerGroupState group = 1;
}

message UpdateGroupOp {
  ConsumerGroupState group = 1;
}

// DeleteGroupOp names its target through GroupOperation.group_id.
message DeleteGroupOp {}

message UpdateCursorOp {
  uint64 cursor = 1;
}

message UpdateCommittedOp {
  uint64 committed = 1;
}

message AddPendingOp {
  PendingEntryState entry = 1;
}

message RemovePendingOp {
  string consumer_id = 1;
  uint64 offset = 2;
}

message TransferPendingOp {
  uint64 offset = 1;
  string from_consumer = 2;
  string to_consumer = 3;
}

message RegisterConsumerOp {
  ConsumerState consumer = 1;
}

message UnregisterConsumerOp {
  string consumer_id = 1;
}

message RequeuePendingOp {
  string consumer_id = 1;
  uint64 offset = 2;
}

// ConsumerGroupState is the replicated state of one consumer group.
message ConsumerGroupState {
  string id = 1;
  string queue_name = 2;
  string pattern = 3;
  string mode = 4;
  bool auto_commit = 5;
  QueueCursorState cursor = 6;

  // The pending entry list, flattened. Each entry names its own consumer, so
  // the per-consumer grouping is rebuilt on receipt.
  repeated PendingEntryState pending = 7;

  repeated ConsumerState consumers = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message QueueCursorState {
  uint64 cursor = 1;
  uint64 committed = 2;
}

message PendingEntryState {
  uint64 offset = 1;
  string consumer_id = 2;
  google.protobuf.Timestamp claimed_at = 3;
  uint32 delivery_count = 4;
}

message ConsumerState {
  string id = 1;
  string client_id = 2;
  string proxy_node_id = 3;
  google.protobuf.Timestamp registered_at = 4;
  google.protobuf.Timestamp last_heartbeat = 5;
}

message ForwardGroupOpResponse {
  bool success = 1;
  string error = 2;
}

// =============================================================================
// Topic-Based Forward Publish (per-node fan-out)
// =============================================================================

message ForwardPublishRequest {
  reserved 1, 2, 3, 4, 5;
  reserved "topic", "payload", "qos", "retain", "properties";

  // envelope is a complete binary message.Envelope.
  //
  // NOTE: Deduplication across retries is not implemented yet.
  // A future dedup_key field can be added for idempotent forwarding.
  bytes envelope = 6;
}

message ForwardPublishBatchRequest {
  repeated ForwardPublishRequest messages = 1;
}

message ForwardPublishBatchError {
  uint32 index = 1;
  string topic = 2;
  string error = 3;
}

message ForwardPublishBatchResponse {
  bool success = 1;
  string error = 2;
  uint32 delivered = 3;
  repeated ForwardPublishBatchError failures = 4;
}
