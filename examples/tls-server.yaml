# MQTT Broker with TLS/SSL Support
# This configuration demonstrates how to enable TLS for secure MQTT connections

server:
  # MQTT transports live under server.mqtt so that `tcp` is not mistaken
  # for a generic listener; AMQP has its own sections below.
  mqtt:
    tcp:
      # Plaintext MQTT 3.1.1 alongside the TLS listeners below. The v5 slot is
      # explicitly disabled: an empty addr skips the listener, and leaving it
      # unset would silently inherit the default plaintext port :1884.
      v3:
        addr: ":1883"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
      v5:
        addr: ""
      tls:
        addr: ":8883"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        min_version: "TLS1.2"
        prefer_server_cipher_suites: true
        cipher_suites:
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      mtls:
        addr: ":8884"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        ca_file: "/etc/fluxmq/certs/ca.crt"
        client_auth: "require"
        # The verified leaf certificate CN must exactly equal the external
        # entity ID returned by the auth service below.
        min_version: "TLS1.2"
        prefer_server_cipher_suites: true
        cipher_suites:
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

  # WebSocket with TLS (WSS)
    websocket:
      v3:
        addr: ":8083"
        path: "/mqtt"
      # Disabled: the default v5 plaintext port is :8084, which is the WSS
      # address declared below. Leaving it unset makes the two collide.
      v5:
        addr: ""
      tls:
        addr: ":8084"
        path: "/mqtt"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
      mtls:
        addr: ":8085"
        path: "/mqtt"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        ca_file: "/etc/fluxmq/certs/ca.crt"
        client_auth: "require"

  http:
    plain:
      addr: ":8080"
    tls:
      addr: ":8443"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
    mtls:
      addr: ":8444"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
      ca_file: "/etc/fluxmq/certs/ca.crt"
      client_auth: "require"

  coap:
    plain:
      addr: ":5683"
    dtls:
      addr: ":5684"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
    mdtls:
      addr: ":5685"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
      ca_file: "/etc/fluxmq/certs/ca.crt"
      client_auth: "require"

  # Health check endpoint (non-TLS)
  health_enabled: true
  health_addr: ":8081"

  # Metrics
  metrics_enabled: false

  shutdown_timeout: "30s"

broker:
  max_message_size: 1048576 # 1MB
  max_retained_messages: 10000
  retry_interval: "20s"
  max_retries: 0

session:
  max_sessions: 10000
  default_expiry_interval: 300 # 5 minutes
  max_offline_queue_size: 1000
  max_inflight_messages: 1000

storage:
  type: "badger"
  badger_dir: "/var/lib/mqtt/data"

cluster:
  enabled: false
  node_id: "broker-1"

log:
  level: "info"
  format: "json"

# MQTT mTLS is bound two-factor authentication: the certificate identity above
# and CONNECT username/password must both be valid. This endpoint must
# implement FluxMQ's auth callout contract.
auth:
  external:
    url: "http://localhost:7016"
    transport: "grpc"
    timeout: "5s"
    protocols:
      mqtt: true
# Notes:
# 1. Generate certificates:
#    openssl req -x509 -newkey rsa:2048 -keyout server.key -out server.crt -days 365 -nodes
#
# 2. For mutual TLS (mTLS), use tcp.mtls or websocket.mtls and provide a CA file:
#    cert_file: "/etc/fluxmq/certs/server.crt"
#    key_file: "/etc/fluxmq/certs/server.key"
#    ca_file: "/etc/fluxmq/certs/ca.crt"
#    client_auth: "require"
#
# 3. Clients connect using:
#    mosquitto_pub -h localhost -p 8883 --cafile ca.crt -u entity-id -P api-key -t test -m "hello"
#
#    The auth callout below covers every MQTT listener, not only the mTLS one,
#    so the TLS listener authenticates with credentials too. Only the mTLS
#    listener additionally binds the identity to the client certificate.
#
# 4. For mutual TLS (mTLS), the username must resolve to the identity in the
#    verified certificate CN and the password must pass external authentication:
#    mosquitto_pub -h localhost -p 8884 --cafile ca.crt --cert client.crt --key client.key -u entity-id -P api-key -t test -m "hello"
#
# 5. For CoAP DTLS, configure coap.dtls or coap.mdtls with cert/key (and ca_file for mdtls).
