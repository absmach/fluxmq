# MQTT Broker - Single Node Cluster Configuration
# Single node with clustering enabled for testing cluster features
# Uses embedded etcd for metadata storage

server:
  # MQTT transports live under server.mqtt so that `tcp` is not mistaken
  # for a generic listener; AMQP has its own sections below.
  mqtt:
    tcp:
      # MQTT 3.1.1 and MQTT 5.0 get their own listeners; a single plaintext
      # port cannot serve both, and each slot's protocol is fixed.
      v3:
        addr: ":1883"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
      v5:
        addr: ":1884"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
      tls: {}
      mtls: {}

    websocket:
      v3:
        addr: ":8083"
        path: "/mqtt"
      v5:
        addr: ":8084"
        path: "/mqtt"
      tls: {}
      mtls: {}

  http:
    plain: {}
    tls: {}
    mtls: {}

  coap:
    plain: {}
    dtls: {}
    mdtls: {}

  amqp091:
    plain:
      addr: ":5682"
    tls: {}
    mtls: {}

  shutdown_timeout: "30s"

broker:
  max_message_size: 1048576 # 1MB
  max_retained_messages: 10000
  retry_interval: "20s"
  max_retries: 0

session:
  max_sessions: 10000
  default_expiry_interval: 300
  max_offline_queue_size: 1000
  max_inflight_messages: 1000

storage:
  type: "badger"
  badger_dir: "/tmp/fluxmq/cluster-data"

cluster:
  enabled: true
  allow_insecure: true # Development-only example.
  node_id: "node1"

  etcd:
    data_dir: "/tmp/fluxmq/cluster-etcd"
    bind_addr: "127.0.0.1:2380"
    client_addr: "127.0.0.1:2379"
    initial_cluster: "node1=http://127.0.0.1:2380"
    bootstrap: true

  transport:
    bind_addr: "127.0.0.1:7948"

log:
  level: "debug"
  format: "text"
