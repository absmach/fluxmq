# FluxMQ — Production Profile
#
# Opinionated configuration for a hardened single-node deployment. Tune for
# your workload (max_connections, queue sizes, rate-limit burst) before
# shipping to production.
#
# Required out-of-band setup:
#   - TLS certificate + key, plus CA bundle for client mTLS
#   - External auth callout reachable on auth.internal:9090 (or disable)
#   - Local-principal client CA + 32-byte secret files when enabling
#     the local AMQP event listener
#   - OTLP-compatible collector reachable on otel.internal:4317
#   - Persistent volume mounted at /var/lib/fluxmq
#
# What this profile enables vs. examples/config.yaml:
#   - TLS on every public listener; plaintext listeners are commented out
#   - mTLS on the admin API and inter-cluster gRPC paths
#   - External auth callout with bounded identity cache
#   - Rate-limit on connections, messages, and subscriptions
#   - Webhook notifier with worker pool + circuit breaker
#   - OTel traces + metrics over TLS
#   - Strict log level (info, JSON, sampled by your log aggregator)

server:
  # MQTT transports live under server.mqtt so that `tcp` is not mistaken
  # for a generic listener; AMQP has its own sections below.
  mqtt:
    tcp:
      # Plaintext MQTT is intentionally disabled. Both plaintext slots must be
      # set to an empty addr explicitly: omitting them leaves the built-in
      # defaults (:1883 for v3, :1884 for v5) in place and the broker would
      # listen in the clear. Re-enable only behind a trusted load balancer that
      # terminates TLS.
      v3:
        addr: ""
      v5:
        addr: ""
      tls:
        addr: ":8883"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        min_version: "TLS1.2"
        prefer_server_cipher_suites: true
        cipher_suites:
          - TLS_AES_128_GCM_SHA256
          - TLS_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      mtls:
        addr: ":8884"
        max_connections: 10000
        read_timeout: "60s"
        write_timeout: "60s"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        ca_file: "/etc/fluxmq/certs/clients-ca.crt"
        client_auth: "require"
        min_version: "TLS1.2"

    websocket:
      # Plaintext WS disabled; expose only WSS publicly. As above, the empty
      # addrs are required — the v5 default (:8084) is the WSS port below, so
      # omitting these would both leak plaintext and collide.
      v3:
        addr: ""
      v5:
        addr: ""
      tls:
        addr: ":8084"
        path: "/mqtt"
        cert_file: "/etc/fluxmq/certs/server.crt"
        key_file: "/etc/fluxmq/certs/server.key"
        min_version: "TLS1.2"

  http:
    # HTTP publish bridge over TLS only.
    tls:
      addr: ":8443"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
      min_version: "TLS1.2"

  amqp:
    tls:
      addr: ":5671"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"

  amqp091:
    tls:
      addr: ":5681"
      max_connections: 10000
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
    # Private, mTLS-only listener for local service principals. Never expose
    # this port through a public load balancer.
    local:
      addr: ":5683"
      max_connections: 32
      cert_file: "/run/secrets/fluxmq_internal_server_cert"
      key_file: "/run/secrets/fluxmq_internal_server_key"
      ca_file: "/run/secrets/local_client_ca"
      client_auth: "require"
      min_version: "TLS1.2"

  coap:
    mdtls:
      addr: ":5685"
      cert_file: "/etc/fluxmq/certs/server.crt"
      key_file: "/etc/fluxmq/certs/server.key"
      ca_file: "/etc/fluxmq/certs/clients-ca.crt"
      client_auth: "require"

  # Health probe stays plaintext on localhost; bind to a private interface
  # if the host is multi-homed.
  health_enabled: true
  health_addr: "127.0.0.1:8081"

  # Admin API. h2c is acceptable only on localhost; for remote access put
  # TLS in front and require mTLS. The TLS fields here apply when set.
  admin_api_addr: "127.0.0.1:8082"

  # OTLP exporter targets — gRPC TLS by default. Set otel_insecure: true only
  # when the collector is on localhost.
  metrics_enabled: true
  metrics_addr: "otel.internal:4317"
  otel_service_name: "fluxmq"
  otel_service_version: "1.0.0"
  otel_traces_enabled: true
  otel_metrics_enabled: true
  otel_trace_sample_rate: 0.05
  otel_insecure: false
  otel_ca_file: "/etc/fluxmq/certs/otel-ca.crt"
  otel_cert_file: "/etc/fluxmq/certs/otel-client.crt"
  otel_key_file: "/etc/fluxmq/certs/otel-client.key"

  shutdown_timeout: "30s"

broker:
  max_message_size: 1048576  # 1 MiB; raise only with measured need
  max_retained_messages: 100000
  retry_interval: "20s"
  max_retries: 5

session:
  max_sessions: 50000
  default_expiry_interval: 3600
  max_offline_queue_size: 1000
  max_inflight_messages: 100

storage:
  type: "badger"
  badger_dir: "/var/lib/fluxmq/data"

# External auth callout. Required for any multi-tenant deployment.
# IdentityCacheSize bounds memory; IdentityCacheTTL forces re-auth on a
# schedule so revoked tokens are eventually rejected.
auth:
  external:
    url: "https://auth.internal:9090"
    transport: "grpc"
    timeout: "2s"
    protocols:
      mqtt: true
      amqp: true
      amqp091: true
      http: true
      coap: true
    identity_cache_size: 50000
    identity_cache_ttl: "1h"

  # Local principals are valid only on server.amqp091.local. Unknown
  # principals fail closed and never fall back to auth.external.
  local_principals:
    - name: "audit-publisher"
      certificate_uri_san: "spiffe://example.org/audit-publisher"
      role: "publisher"
      current_secret_file: "/run/secrets/audit_secret_current"
      previous_secret_file: "/run/secrets/audit_secret_previous"
      permissions:
        publish:
          - exchange: ""
            routing_key: "audit.events"
        subscribe: []

# Optional blocking hooks. Enable only when an external policy/normalization
# service must decide before FluxMQ continues the operation.
#
# hooks:
#   url: "https://hooks.internal:7017"
#   transport: "grpc"
#   timeout: "500ms"
#   fail_mode: "deny"
#   protocols:
#     mqtt: true
#     amqp: true
#     amqp091: true
#     http: true
#     coap: false
#   events:
#     auth_on_register: true
#     auth_on_publish: true
#     auth_on_subscribe: true
#     auth_on_unsubscribe: true

# Per-IP / per-client rate limits. Always enable in production.
ratelimit:
  enabled: true
  connection:
    enabled: true
    rate: 50.0
    burst: 100
    cleanup_interval: "5m"
  message:
    enabled: true
    rate: 1000.0
    burst: 2000
  subscribe:
    enabled: true
    rate: 50.0
    burst: 100

# Outbound webhooks. Set enabled: false if you don't need event fanout.
webhook:
  enabled: true
  queue_size: 10000
  drop_policy: "oldest"
  workers: 8
  include_payload: false
  shutdown_timeout: "30s"
  defaults:
    timeout: "5s"
    retry:
      max_attempts: 5
      initial_interval: "1s"
      max_interval: "30s"
      multiplier: 2.0
    circuit_breaker:
      failure_threshold: 5
      reset_timeout: "60s"
  endpoints: []  # Populate per environment.

cluster:
  enabled: false
  node_id: "broker-1"
  # When enabling clustering, both etcd and the gRPC transport MUST be mTLS.
  # See examples/single-node-cluster.yaml for the full schema.

log:
  level: "info"
  format: "json"

# Pre-provisioned stream used by the restricted audit publisher. The publisher
# is not permitted to declare or mutate broker topology.
queues:
  - name: "audit.events"
    topics:
      - "$queue/audit.events/#"
    reserved: true
    type: "stream"
    retention:
      max_age: "720h"
      max_length_bytes: 10737418240
      max_length_messages: 0
    limits:
      max_message_size: 1048576
      # Keep per-message expiry aligned with the 30-day retention window.
      message_ttl: "720h"

# Notes for operators:
#   1. Run the broker container with read_only rootfs, cap_drop ALL, and
#      no-new-privileges (see deployments/docker/compose.yaml).
#   2. Rotate server certs and the auth-callout client cert separately.
#   3. /api/v1/reload is exposed on admin_api_addr — never bind that to a
#      public interface; put mTLS or a token middleware in front.
#   4. Verify the image signature before pulling:
#        cosign verify --certificate-identity-regexp 'absmach/fluxmq' \
#          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#          ghcr.io/absmach/fluxmq:<tag>
