version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "./.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    groups:
      gh-dependency:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"

  - package-ecosystem: "docker"
    directories:
      - "./ui/docker"
      - "./deployments/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    groups:
      docker-dependency:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "./ui"
      - "./docs"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    groups:
      npm-dependency:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is the native (Go) compiler and no longer ships the
      # JavaScript compiler API at typescript/lib/typescript.js, which
      # `next build` and @typescript-eslint both require. Unpin once Next.js
      # and typescript-eslint support it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
